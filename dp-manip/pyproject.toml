[project]
name = "dp-manip"
version = "0.1.0"
description = "Cluster-first RGB Diffusion Policy training for ManiSkill demonstrations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py==3.16.0",
    "numpy==1.26.4",
    "torch==2.14.0",
    # DDPM scheduler used by the RGB policy.
    "diffusers==0.40.0",
    # Closed-loop RGB evaluation; training itself does not import ManiSkill.
    "mani-skill==3.0.1",
    "sapien==3.0.3",
    "gymnasium==1.3.0",
]

[tool.uv]
package = false
