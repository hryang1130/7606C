# PickCube, state observations, pd_joint_pos (8-D absolute joint targets + gripper).
# 100 motion-planning demos from ubuntu (single-process run_cpu.py, seeds from 0).
# Use data.num_demos=N for nested subsets (first N by episode id).
# Policy / train values follow ManiSkill's DP baseline (baselines.sh, PickCube state).

[task]
env_id = "PickCube-v1"
control_mode = "pd_joint_pos"
obs_mode = "state"
sim_backend = "physx_cpu"
# Official DP baseline uses 100 for PickCube; demos are 49-88 steps.
max_episode_steps = 100

[data]
demo_path = "data/pickcube/state/pickcube_batch100.state.pd_joint_pos.physx_cpu.h5"

[policy]
obs_horizon = 2
act_horizon = 8
pred_horizon = 16
diffusion_step_embed_dim = 64
unet_dims = [64, 128, 256]
n_groups = 8
num_diffusion_iters = 100

[train]
seed = 1
total_iters = 30000
batch_size = 1024
lr = 1e-4
weight_decay = 1e-6
warmup_steps = 500
log_freq = 1000
eval_freq = 5000
save_freq = 0

[eval]
val_seed_start = 5000
val_episodes = 50
test_seed_start = 10000
test_episodes = 100
num_envs = 10
